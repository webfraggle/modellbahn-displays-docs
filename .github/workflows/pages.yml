name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Install PDF toolchain (pandoc + texlive + fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            texlive-xetex \
            texlive-lang-german \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-fonts-extra \
            texlive-plain-generic \
            fonts-ibm-plex \
            fonts-jetbrains-mono \
            python3-yaml \
            wget

      - name: Install Newsreader font
        run: |
          set -e
          mkdir -p "$HOME/.local/share/fonts"
          rm -rf /tmp/gfonts
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/google/fonts.git /tmp/gfonts
          git -C /tmp/gfonts sparse-checkout set --no-cone ofl/newsreader
          # static/ enthält die klassischen TTFs; Fallback auf das Variable-Font-TTF
          if ls /tmp/gfonts/ofl/newsreader/static/*.ttf >/dev/null 2>&1; then
            cp /tmp/gfonts/ofl/newsreader/static/*.ttf "$HOME/.local/share/fonts/"
          else
            cp /tmp/gfonts/ofl/newsreader/*.ttf "$HOME/.local/share/fonts/"
          fi
          fc-cache -f
          echo "--- Installierte Newsreader-Faces ---"
          fc-list | grep -i newsreader || { echo "FEHLER: keine Newsreader-Faces gefunden"; exit 1; }

      - name: Generate PDFs
        run: python3 scripts/generate_pdfs.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
