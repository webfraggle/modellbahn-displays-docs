<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="{{ '/assets/images/logo.png' | relative_url }}">
{% if site.staging %}
<meta name="robots" content="noindex, nofollow">
<style>
  /* Staging-Hinweis, nur auf preview.modellbahn-displays.de sichtbar */
  body::after {
    content: "Vorschau · Staging";
    position: fixed;
    right: 0;
    bottom: 0;
    z-index: 1000;
    padding: 0.5rem 0.875rem;
    background: #FD7014;
    color: #fff;
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    border-top-left-radius: 6px;
  }
</style>
{% endif %}
